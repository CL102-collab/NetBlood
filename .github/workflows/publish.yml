---
name: Publish

'on':
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    # The caller must finish all test/package gates. PR/manual calls cannot publish.
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Verify packages from this exact successful run
        run: python3 platform/ci/package.py verify-release --directory dist
      - name: Verify the published release still targets the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release.json").read_text())
          if (release.get("id") != int(os.environ["RELEASE_ID"])
                  or release.get("tag_name") != os.environ["RELEASE_TAG"]
                  or release.get("draft") is not False or not release.get("published_at")):
              raise SystemExit("The original release is no longer published with its expected tag.")
          PY
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_revision="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$release_revision" != "$SOURCE_REVISION" ]; then
            echo "Release tag no longer points to the tested commit; refusing to upload." >&2
            exit 1
          fi
      - name: Attach the complete package set to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Without --clobber, GitHub rejects any existing asset of the same name.
          gh release upload "$RELEASE_TAG" \
            dist/*.zip dist/*.deb dist/*.AppImage dist/*.tar.xz dist/SHA256SUMS
