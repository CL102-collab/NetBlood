---
name: Publish

'on':
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    # Failed/cancelled tests or packages can never fall back to a previous run.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Verify packages from this exact successful run
        run: python3 platform/ci/package.py verify-release --directory dist
      - name: Publish the complete package set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="r$(git rev-list --count HEAD)-${SOURCE_REVISION:0:8}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          NetBlood packages for Windows, Debian 12, Linux AppImage, macOS, FreeBSD, and NetBSD.

          All 144 legacy demos and the regression suites passed before packaging.
          Blood game data is required separately. See platform/ci/README.md in the source tree for platform requirements.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite its packages." >&2
            exit 1
          fi
          gh release create "$tag" --target "$SOURCE_REVISION" --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.zip dist/*.deb dist/*.AppImage dist/*.tar.xz dist/SHA256SUMS
